<svg width="1024" height="1024" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&display=swap');
    ]]></style>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C974" />
      <stop offset="30%" stop-color="#FFF2A8" />
      <stop offset="70%" stop-color="#C69E38" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>

    <linearGradient id="gold-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914" />
      <stop offset="30%" stop-color="#C69E38" />
      <stop offset="50%" stop-color="#FFF2A8" />
      <stop offset="70%" stop-color="#C69E38" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>

    <linearGradient id="bone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FDFBF4" />
      <stop offset="80%" stop-color="#EBE2CD" />
      <stop offset="100%" stop-color="#D1C3A5" />
    </linearGradient>

    <filter id="drop_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <polygon id="seg-a" points="10,2 28,2 32,6 28,10 10,10 6,6" />
    <polygon id="seg-b" points="34,8 38,12 38,26 34,30 30,26 30,12" />
    <polygon id="seg-c" points="34,34 38,38 38,52 34,56 30,52 30,38" />
    <polygon id="seg-d" points="10,54 28,54 32,58 28,62 10,62 6,58" />
    <polygon id="seg-e" points="4,34 8,38 8,52 4,56 0,52 0,38" />
    <polygon id="seg-f" points="4,8 8,12 8,26 4,30 0,26 0,12" />
    <polygon id="seg-g" points="10,28 28,28 32,32 28,36 10,36 6,32" />

    <g id="digit-bg">
      <use href="#seg-a"/><use href="#seg-b"/><use href="#seg-c"/><use href="#seg-d"/><use href="#seg-e"/><use href="#seg-f"/><use href="#seg-g"/>
    </g>
    <g id="digit-0">
      <use href="#seg-a"/><use href="#seg-b"/><use href="#seg-c"/><use href="#seg-d"/><use href="#seg-e"/><use href="#seg-f"/>
    </g>
    <g id="digit-2">
      <use href="#seg-a"/><use href="#seg-b"/><use href="#seg-g"/><use href="#seg-e"/><use href="#seg-d"/>
    </g>
    <g id="digit-5">
      <use href="#seg-a"/><use href="#seg-f"/><use href="#seg-g"/><use href="#seg-c"/><use href="#seg-d"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="500" height="500" fill="#0C2115" />

  <!-- 微妙なグラデーション感 -->
  <radialGradient id="bg-glow" cx="50%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#163322" />
    <stop offset="100%" stop-color="#0C2115" />
  </radialGradient>
  <rect width="500" height="500" fill="url(#bg-glow)" />

  <!-- アプリ名 大きく -->
  <text x="250" y="126" fill="url(#gold-h)" filter="url(#text-glow)"
    font-family="'Shippori Mincho', serif" font-size="118" font-weight="800"
    text-anchor="middle" letter-spacing="10">麻雀</text>
  <text x="250" y="255" fill="url(#gold-h)" filter="url(#text-glow)"
    font-family="'Shippori Mincho', serif" font-size="118" font-weight="800"
    text-anchor="middle" letter-spacing="4">点数卓</text>

  <!-- 細い金ライン（区切り） -->
  <line x1="60" y1="272" x2="440" y2="272" stroke="url(#gold-h)" stroke-width="1.5" opacity="0.5" />

  <!-- スコア枠 -->
  <rect x="40" y="284" width="420" height="156" rx="14" fill="#000000" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- 7セグ背景 -->
  <g fill="#2a1400" transform="translate(86, 308) scale(1.55) skewX(-10)">
    <use href="#digit-bg" x="0" y="0" />
    <use href="#digit-bg" x="46" y="0" />
    <use href="#digit-bg" x="92" y="0" />
    <use href="#digit-bg" x="138" y="0" />
    <use href="#digit-bg" x="184" y="0" />
  </g>

  <!-- 25000 -->
  <g fill="#FF9900" filter="url(#glow)" transform="translate(86, 308) scale(1.55) skewX(-10)">
    <use href="#digit-2" x="0" y="0" />
    <use href="#digit-5" x="46" y="0" />
    <use href="#digit-0" x="92" y="0" />
    <use href="#digit-0" x="138" y="0" />
    <use href="#digit-0" x="184" y="0" />
  </g>

  <!-- 下部：細いゴールドライン -->
  <line x1="60" y1="462" x2="440" y2="462" stroke="url(#gold-h)" stroke-width="1" opacity="0.3" />
</svg>
